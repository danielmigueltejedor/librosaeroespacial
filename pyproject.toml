[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobooks-framework"
version = "0.3.0"
description = "Framework editorial reproducible para libros académicos en LaTeX"
requires-python = ">=3.11"
authors = [
  { name = "Daniel Miguel Tejedor" }
]
dependencies = []

[project.scripts]
aerobooks = "framework.aerobooks.cli:main"
aerobooks-ai = "framework.aerobooks.academic:main"

[tool.setuptools]
packages = ["framework", "framework.aerobooks"]
