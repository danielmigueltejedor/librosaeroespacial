name: AeroBooks build PDFs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "books/**"
      - "framework/latex/**"
      - "framework/aerobooks/**"
      - "shared/**"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - "books/**"
      - "framework/**"
      - "shared/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AeroBooks
        run: python -m pip install -e .

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            biber \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            texlive-lang-spanish \
            texlive-science
          sudo apt-get clean

      - name: Build every AeroBooks book
        shell: bash
        run: |
          set -euo pipefail
          for cfg in books/*/book.toml; do
            [ -e "$cfg" ] || continue
            slug="$(basename "$(dirname "$cfg")")"
            echo "::group::Build $slug"
            aerobooks build "$slug"
            echo "::endgroup::"
          done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: aerobooks-pdfs
          path: books/*/main.pdf
          if-no-files-found: error
