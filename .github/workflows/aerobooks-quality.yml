name: AeroBooks quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AeroBooks
        run: python -m pip install -e .

      - name: Doctor
        run: aerobooks --version

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: AeroBooks 0.3 contracts
        run: python -m unittest tests.test_v03 -v

      - name: AeroBooks 0.4 exercise gate
        run: python -m unittest tests.test_v04 -v

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for cfg in books/*/book.toml; do
            [ -e "$cfg" ] || continue
            found=1
            slug="$(basename "$(dirname "$cfg")")"
            echo "::group::AeroBooks check $slug"
            aerobooks check "$slug" --strict
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No AeroBooks books found."
          fi

      - name: Academic coverage
        shell: bash
        run: |
          set -euo pipefail
          for cfg in books/*/book.toml; do
            [ -e "$cfg" ] || continue
            slug="$(basename "$(dirname "$cfg")")"
            echo "::group::AeroBooks academic coverage $slug"
            aerobooks-ai coverage "$slug" --strict
            echo "::endgroup::"
          done
