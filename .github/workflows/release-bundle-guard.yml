name: Require complete library ZIP on every release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  require-complete-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Detect installed default-branch policy
        id: policy
        env:
          REVIEW_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          enabled=true
          if [[ "$REVIEW_RELEASE" == "true" && ! -e release-bundle.json && ! -e scripts/package-release-bundle.py ]] &&
             [[ -z "$(git log -1 --format=%H -- release-bundle.json scripts/package-release-bundle.py)" ]]; then
            enabled=false
            echo '::notice::Review release before the bundle policy is installed on the default branch; the publisher must verify its ZIP. Merge the policy PR to enable this guard.'
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ZIP verification dependency
        if: steps.policy.outputs.enabled == 'true'
        run: python -m pip install pypdf==6.21.1
      - name: Download and validate release assets and SHA-256 integrity
        id: validate
        if: steps.policy.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name }}
          REVIEW_RELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/release-bundle"
          mkdir -p "$CHECK_DIR"
          gh release download "$TAG" --dir "$CHECK_DIR"
          python scripts/package-release-bundle.py --verify-only \
            --output "$CHECK_DIR/LibrosStudium-bundle-completo.zip"
          if [[ "$REVIEW_RELEASE" == "false" ]]; then
            (cd "$CHECK_DIR" && sha256sum --check SHA256SUMS.txt)
            TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            python - "$CHECK_DIR/RELEASE.json" "$TAG" "$TAG_COMMIT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["tag"] == sys.argv[2] and report["commit_sha"] == sys.argv[3]
          assert report["academic_certification"] is False
          PY
          fi
      - name: Return an invalid publication to draft
        if: steps.validate.outcome == 'failure'
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=true
          echo 'Release returned to draft: its complete library ZIP could not be validated.'
          exit 1
