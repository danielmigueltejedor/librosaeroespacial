name: Require complete library ZIP on every release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  require-complete-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Detect installed default-branch policy
        id: policy
        env:
          REVIEW_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          enabled=true
          if [[ "$REVIEW_RELEASE" == "true" && ! -e release-bundle.json && ! -e scripts/package-release-bundle.py ]] &&
             [[ -z "$(git log -1 --format=%H -- release-bundle.json scripts/package-release-bundle.py)" ]]; then
            enabled=false
            echo '::notice::Review release before the bundle policy is installed on the default branch; the publisher must verify its ZIP. Merge the policy PR to enable this guard.'
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ZIP verification dependency
        if: steps.policy.outputs.enabled == 'true'
        run: python -m pip install pypdf==6.21.1
      - name: Download and validate the full subject-organized bundle
        id: validate
        if: steps.policy.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern LibrosStudium-bundle-completo.zip --dir "$RUNNER_TEMP/release-bundle"
          python scripts/package-release-bundle.py --verify-only --output "$RUNNER_TEMP/release-bundle/LibrosStudium-bundle-completo.zip"
      - name: Return an invalid publication to draft
        if: steps.validate.outcome == 'failure'
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=true
          echo 'Release returned to draft: its complete library ZIP could not be validated.'
          exit 1
