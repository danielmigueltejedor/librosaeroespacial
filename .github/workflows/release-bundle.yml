name: Publish complete library bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".github/release-requests/matmo-2026-10-24-r3.md"
permissions:
  contents: write
concurrency:
  group: complete-library-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate a new tag
        env:
          TAG: ${{ github.event_name == 'push' && 'librosstudium-2026-10-24-r3' || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]+$ ]]
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-audit.txt -r enciclopedia-programacion/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-lang-spanish texlive-science lmodern poppler-utils
      - name: Worked solution regressions
        run: |
          python books/mecanica-fluidos/scripts/check_solution_procedures.py
          python -m pytest -q tests/test_solution_procedures.py

      - name: Build every registered book
        run: |
          python scripts/build-studium-books.py all
          python scripts/check-solution-builds.py
          python enciclopedia-programacion/tools/build_collection.py all --review-copy
          python enciclopedia-programacion/tools/check_integral.py
          python enciclopedia-programacion/tools/check_prose_formatting.py
          python enciclopedia-programacion/tools/check_literal_fidelity.py
      - name: Build literature, history and biology review editions
        run: |
          python -m venv "$RUNNER_TEMP/humanities"
          "$RUNNER_TEMP/humanities/bin/python" -m pip install -r humanidades-y-ciencias/requirements.txt
          "$RUNNER_TEMP/humanities/bin/python" humanidades-y-ciencias/tools/build_books.py
      - name: Check packaging contracts and build complete ZIP
        run: |
          python -m pytest -q tests/test_release_bundle.py
          python scripts/package-release-bundle.py
          python scripts/package-release-bundle.py --verify-only
          sha256sum dist/release/LibrosStudium-bundle-completo.zip > dist/release/SHA256SUMS.txt
          for volume in manual problemas simulacros; do
            cp "dist/studium/materiales-mantenimiento-motores/materiales-mantenimiento-motores-${volume}.pdf" dist/release/
          done
          (cd dist/release && sha256sum materiales-mantenimiento-motores-{manual,problemas,simulacros}.pdf > SHA256SUMS-MATMO.txt)
      - name: Create draft, upload bundle and publish review edition
        env:
          TAG: ${{ github.event_name == 'push' && 'librosstudium-2026-10-24-r3' || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Libros Studium — $TAG" \
            --notes "Edición de estudio y revisión 2026-10-24 r3. MATMO: contenido acumulado de r2 y nueva profundización con derivaciones científicas, 3 diagramas originales, 8 capítulos reforzados, 6 problemas avanzados resueltos y 12 casos de teoría con respuestas, además de los simulacros anteriores. Incluye ZIP completo y tres PDF individuales con comprobación de integridad SHA-256. Edición académica en revisión; no implica aprobación científica independiente." \
            dist/release/LibrosStudium-bundle-completo.zip dist/release/SHA256SUMS.txt \
            dist/release/materiales-mantenimiento-motores-manual.pdf \
            dist/release/materiales-mantenimiento-motores-problemas.pdf \
            dist/release/materiales-mantenimiento-motores-simulacros.pdf \
            dist/release/SHA256SUMS-MATMO.txt
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --pattern LibrosStudium-bundle-completo.zip --dir "$RUNNER_TEMP/release-check"
          python scripts/package-release-bundle.py --verify-only --output "$RUNNER_TEMP/release-check/LibrosStudium-bundle-completo.zip"
          gh release download "$TAG" --pattern 'materiales-mantenimiento-motores-*.pdf' --dir "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --pattern SHA256SUMS-MATMO.txt --dir "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" && sha256sum -c SHA256SUMS-MATMO.txt)
          gh release edit "$TAG" --draft=false --prerelease --latest=false
