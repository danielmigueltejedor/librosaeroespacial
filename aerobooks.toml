# Valores reutilizables de la colección.
# Un libro los hereda y puede sobrescribir cualquiera en book.toml.

[author]
name = "Daniel Miguel Tejedor"

[institution]
name = "Universidad de León"

[program]
name = "Grado en Ingeniería Aeroespacial"
language = "es"

[editorial]
subtitle = "Manual académico"
volume = "Volumen I"
volume_title = "Fundamentos"
legal_notice = "Edición de estudio independiente."
units = "SI"
citation_style = "authoryear"

[pedagogy]
audience = "grado"
from_scratch = true
physical_understanding = true
derivations = true
problem_solving = true
exam_preparation = true
later_reference = true
proofs = "show-steps"
problems = "original-graded"

[research]
mode = "source_plus_research"
source_first = true
fail_closed = true
record_claims = true
record_conflicts = true
allow_snippet_evidence = false
high_risk_min_independent_sources = 2

[quality]
require_source_audit = true
require_claim_ledger = true
require_claim_links = true
require_list_of_figures = true
require_list_of_tables = true
require_visual_review = true

[copyright]
reproduce_student_notes = false
verbatim_policy = "short-attributed"
student_material_tier = "D"
