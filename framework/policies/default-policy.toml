# AeroBooks default policy

[framework]
name = "AeroBooks"
policy_version = 1

[sources]
allowed_tiers = ["A", "B", "C", "D", "E"]
default_research_mode = "source_plus_research"
fail_closed = true
record_external_sources = true
record_conflicts = true

[claims]
require_sources_for_verified = true
require_derivation_or_source_for_high_risk = true
types = [
  "scientific",
  "mathematical",
  "historical",
  "biographical",
  "numerical",
  "definition",
  "exam_pattern",
  "interpretation",
  "derived_result",
  "regulatory",
  "statistical",
  "experimental",
  "computational",
  "institutional",
  "terminological",
  "safety"
]

[latex]
require_caption_for_figures = true
require_label_for_figures = true
require_caption_for_tables = true
require_label_for_tables = true
require_biblatex = true

[research_v03]
# El contrato 0.2 no usa estas reglas. Un libro 0.3 falla cerrado si falta alguna.
require_course_discovery = true
require_content_access = true
allow_snippet_evidence = false
high_risk_min_independent_sources = 2
block_preprint_as_peer_reviewed = true
block_coverage_gap = true

[release]
strict_static_check = true
compile_required = true
visual_review_required = true
changelog_required = true
